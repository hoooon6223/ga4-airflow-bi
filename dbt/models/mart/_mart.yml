version: 2

models:
  - name: f_orders
    description: >
      1행 = 주문 1건 = 거래번호 1개. 같은 거래번호는 처음 찍힌 이벤트를 쓰고 그 세션에 귀속한다.
      이전 날짜에 이미 있는 거래번호는 제외한다. 빈 구매·거래번호 없는 구매는 포함하지 않으므로
      주문·매출은 실제보다 약 4~5% 과소 집계된다. 현업에서는 원천을 주문 DB로 교체할 자리.
    columns:
      - name: order_date
        description: 주문의 대표 이벤트 날짜. 파티션 키.
      - name: transaction_id
        description: 거래번호. 테이블 전체에서 유일.
        tests: [unique, not_null]
      - name: purchase_revenue
        description: 주문 매출(USD). 그대로 사용 (세금 미포함, 배송비 미수집, 환불 미반영).
      - name: is_new_session
        description: 주문이 귀속된 세션이 그 브라우저의 첫 세션(session_number = 1)인가.

  - name: f_sessions
    description: >
      1행 = 세션 × 날짜. 퍼널 단계는 도달 여부로 센다. orders·revenue는 f_orders에서 이 세션·날짜에
      귀속된 주문만 붙인다. 빈 구매만 있는 세션은 has_valid_order = false.
    columns:
      - name: session_day_key
        description: session_key + session_date. 행 식별자.
        tests: [unique, not_null]
      - name: is_new_session
        description: 신규 세션 (session_number = 1, 같은 브라우저 기준). 아니면 재방문.
      - name: is_checkout_with_cart
        description: 결제 시작 세션 중 같은 세션에 장바구니 담기가 있는 경우 (F02a).
      - name: is_checkout_direct
        description: 결제 시작 세션 중 같은 세션에 장바구니 담기가 없는 경우 (F02b, 바로 결제).
      - name: has_no_tid_purchase
        description: 거래번호 없는 구매가 1개 이상 있는 세션 (DQ2 분자).
      - name: has_valid_order
        description: 주문이 1건 이상 귀속된 세션 (퍼널 F03 구매 세션).

  - name: kpi_daily
    description: >
      1행 = 날짜 × 구분(all / device: desktop·mobile / visitor: new·returning). 대시보드용.
      비교: *_wow = 지난주 같은 요일 (그날이 결함 구간·차단일이면 null = 비교 불가),
      *_avg7 = 직전 7일 중 유효한 날의 평균 (유효일 5일 미만이면 null). 비율은 합계의 비율.
    columns:
      - name: sessions
        description: "K03 세션 수 = 세션 × 날짜 수 (빈 구매 세션 포함)"
      - name: orders
        description: "K02 주문 수 = 거래번호 수 (빈 구매 제외, 약 4~5% 과소)"
      - name: revenue
        description: "K01 매출 = 주문별 purchase_revenue 합 (USD)"
      - name: order_cr
        description: "K04 주문 전환율 = 주문 ÷ 세션"
      - name: aov
        description: "K05 객단가 = 매출 ÷ 주문"
      - name: view_rate
        description: "F10 상품 조회율 = 상품 조회 세션 ÷ 세션"
      - name: view_to_checkout
        description: "F11 조회→결제 = 결제 시작 세션 ÷ 상품 조회 세션"
      - name: checkout_to_purchase
        description: "F12 결제→구매 = 구매 세션(정상 주문 세션) ÷ 결제 시작 세션"
      - name: direct_checkout_share
        description: "F13 바로 결제 비중 = 장바구니 없는 결제 시작 세션 ÷ 결제 시작 세션"
      - name: cart_rate
        description: "S01 장바구니 담기율 = 장바구니 세션 ÷ 상품 조회 세션"
      - name: new_session_share
        description: "S02 신규 세션 비중 = 신규 세션 ÷ 세션"

  - name: dq_daily
    description: >
      1행 = 날짜 × 품질 체크(DQ1~DQ5). status = ok / warn / block / insufficient_baseline.
      stg_events만 읽어 mart와 독립적으로 판정한다. 기준선 = 직전 7일 중 결함 구간·이전 차단일이 아닌 날의 평균
      (유효일 5일 이상). 게이트: tests/gate_block.sql(error), tests/gate_warn.sql(warn).
      기준값과 근거는 docs/02_metric_definitions.md.
    columns:
      - name: value
        description: 판정에 쓰는 값 (비율). numerator ÷ denominator.
      - name: status
        description: ok / warn(경고, 게시하되 표시) / block(차단, 게시 중단) / insufficient_baseline(기준 부족, 판정 안 함)
        tests:
          - accepted_values:
              arguments:
                values: ['ok', 'warn', 'block', 'insufficient_baseline']
      - name: detail
        description: DQ2 진단 정보 (사용자·세션·이벤트 수, 기기 분포, 브라우저). 판정에는 쓰지 않는다.

  - name: kpi_weekly
    description: >
      1행 = 주(월~일) × 구분. 세션과 퍼널 단계는 그 주의 서로 다른 세션 수.
      days_covered < 7이면 진행 중이거나 기간 경계의 주.
