version: 2

sources:
  - name: ga4
    description: >
      GA4 BigQuery Export 원본 (난독화 공개 샘플). 날짜별 테이블 events_YYYYMMDD,
      2020-11-01 ~ 2021-01-31 (92개). 1행 = 이벤트 1건, event_params·items는 배열. 읽기 전용.
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"
        description: 와일드카드 테이블. 날짜는 _TABLE_SUFFIX(YYYYMMDD)로 고른다.
