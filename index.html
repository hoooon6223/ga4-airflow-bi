<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merch Shop 운영 대시보드</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f2f1; --card: #ffffff; --line: #e1dfdd; --header: #252423; --header-ink: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8886;
  --series-1: #2a78d6; --series-2: #eb6834; --ref: #8a8886; --grid: #edebe9;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --critical: #d03b3b;
  --up-ink: #006300; --down-ink: #b3261e;
  --chip-good: #e6f4e6; --chip-warning: #fff4d6; --chip-critical: #fbe5e5; --chip-muted: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #121211; --card: #1a1a19; --line: #383835; --header: #0b0b0b;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a998f;
    --series-1: #3987e5; --series-2: #d95926; --ref: #9a998f; --grid: #2a2a28;
    --up-ink: #5bc95b; --down-ink: #ff8a80;
    --chip-good: #12301a; --chip-warning: #3a2f0c; --chip-critical: #3d1717; --chip-muted: #2a2a28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --card: #1a1a19; --line: #383835; --header: #0b0b0b;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a998f;
  --series-1: #3987e5; --series-2: #d95926; --ref: #9a998f; --grid: #2a2a28;
  --up-ink: #5bc95b; --down-ink: #ff8a80;
  --chip-good: #12301a; --chip-warning: #3a2f0c; --chip-critical: #3d1717; --chip-muted: #2a2a28;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
.top { background: var(--header); color: var(--header-ink); padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: 16px; font-weight: 600; margin: 0; }
.top .date { font-size: 14px; opacity: .85; }
.top a { color: var(--header-ink); opacity: .8; font-size: 13px; margin-left: auto; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; border-left: 4px solid; background: var(--card); }
.banner.good { border-color: var(--good); } .banner.warning { border-color: var(--warning); } .banner.critical { border-color: var(--critical); }
.banner b { white-space: nowrap; }
.section-title { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 18px 0 8px; text-transform: none; }
.section-title span { font-weight: 400; color: var(--ink-3); }
.grid { display: grid; gap: 12px; }
.tiles { grid-template-columns: 1.4fr repeat(4, 1fr); }
.two { grid-template-columns: 1fr 1fr; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; min-width: 0; }
.card h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--ink-2); }
.tile .label { font-size: 13px; color: var(--ink-2); }
.tile .value { font-size: 26px; font-weight: 600; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
.tile.hero .value { font-size: 34px; }
.tile .cmp { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; }
.up { color: var(--up-ink); } .down { color: var(--down-ink); } .flat, .na { color: var(--ink-3); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-size: 13px; }
th { color: var(--ink-2); font-weight: 600; } th:first-child, td:first-child { text-align: left; }
td.l { text-align: left; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--ink); }
.chip.good { background: var(--chip-good); } .chip.warning { background: var(--chip-warning); }
.chip.critical { background: var(--chip-critical); } .chip.muted { background: var(--chip-muted); color: var(--ink-2); }
.funnel .row { display: grid; grid-template-columns: 84px 1fr 120px; gap: 10px; align-items: center; margin: 8px 0; }
.funnel .bar { height: 22px; display: flex; gap: 2px; }
.funnel .seg { height: 100%; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.funnel .seg.direct { background: var(--series-2); }
.funnel .seg.first { border-radius: 0; }
.funnel .n { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.factor { display: grid; grid-template-columns: 90px 1fr 70px; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
.factor .track { position: relative; height: 14px; background: var(--grid); border-radius: 2px; }
.factor .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.factor .fill.pos { background: var(--series-1); } .factor .fill.neg { background: var(--series-2); }
.factor .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }
.note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.foot { font-size: 12px; color: var(--ink-3); margin: 20px 0 8px; line-height: 1.7; }
svg text { fill: var(--ink-3); font-size: 11px; }
.tip { position: fixed; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; }
.detail { font-size: 12px; color: var(--ink-2); text-align: left; }
.blocked { text-align: center; padding: 48px 16px; }
.blocked .big { font-size: 28px; font-weight: 700; margin: 8px 0; }
/* report tabs (Power BI-style pages) */
.tabs { background: var(--card); border-bottom: 1px solid var(--line); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: inherit; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--series-1); }
.js .tabpage { display: none; } .js .tabpage.active { display: block; }
.top .status { margin-left: auto; text-decoration: none; opacity: 1; }
.top .status .chip { font-size: 12px; }
.top .archive { margin-left: 12px; }
/* stat tiles */
.tile { display: flex; flex-direction: column; gap: 2px; }
.tile .row1 { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.tile .head { font-size: 15px; font-weight: 600; margin-top: 2px; }
.tile .head small { font-size: 12px; font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.tile .ref { font-size: 12px; color: var(--ink-2); }
.tile .ref b { font-weight: 600; }
.tile .spark { display: block; width: 100%; height: 30px; margin-top: 8px; }
.tile .spark path { fill: none; stroke: var(--series-1); stroke-width: 2; }
@media (max-width: 900px) { .tiles { grid-template-columns: 1fr 1fr; } .tile.hero { grid-column: 1 / -1; } .two { grid-template-columns: 1fr; } }
@media (max-width: 520px) { main { padding: 12px 16px; } .funnel .row { grid-template-columns: 70px 1fr 90px; } }
</style>
</head>
