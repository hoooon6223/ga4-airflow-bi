# Local Airflow for the GA4 ops dashboard: Postgres metadata DB + LocalExecutor.
#   cd airflow && docker compose up -d --build      UI: http://localhost:8080
# Settings come from airflow/.env (not committed): GCP_KEYFILE_HOST, GA4_GO_LIVE_DATE,
# GITHUB_TOKEN (fine-grained, this repo only, Contents: read & write), GIT_PUBLISH_EMAIL.
# One-time setup of the publish target: git clone --branch gh-pages <repo> .pages (at the repo root).

x-airflow: &airflow
  build: .
  image: ga4-airflow-bi:local
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__SECRET_KEY: local-dev-only
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-jwt
    # Local only: no login screen. Never expose this port beyond localhost.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    GCP_KEYFILE: /opt/secrets/gcp.json
    PROJECT_DIR: /opt/project
    # Airflow connection used by the BigQuery sensor (same mounted service-account key; no secret in this file)
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type": "google_cloud_platform", "extra": {"key_path": "/opt/secrets/gcp.json", "project": "bigquery-457902"}}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../dbt:/opt/project/dbt
    - ../dashboard:/opt/project/dashboard
    - ../site:/opt/project/site
    - ../.pages:/opt/project/.pages          # clone of the gh-pages branch (publish target)
    - ${GCP_KEYFILE_HOST}:/opt/secrets/gcp.json:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg-data:
